<style>
:root{
  --bg:#ffffff; --surface:#f5f6f8; --raised:#ffffff; --line:#dadde1; --ink:#1c2b33; --dim:#5d6c7b;
  --blue:#0866ff; --blue-soft:#e7f0ff; --ok:#1a8f4c; --ok-soft:#e3f5ea; --bad:#d4243a; --bad-soft:#fde8eb;
  --warn:#a56a00; --warn-soft:#fff1d6; --code:#f5f6f8;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#151b22; --raised:#1a222b; --line:#2a3541; --ink:#e8edf2; --dim:#93a1b0;
  --blue:#4c9aff; --blue-soft:#12274a; --ok:#3ccf80; --ok-soft:#10301f; --bad:#ff6b7a; --bad-soft:#3a1a20;
  --warn:#f2b84b; --warn-soft:#3a2d10; --code:#10161c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1318; --surface:#151b22; --raised:#1a222b; --line:#2a3541; --ink:#e8edf2; --dim:#93a1b0;
    --blue:#4c9aff; --blue-soft:#12274a; --ok:#3ccf80; --ok-soft:#10301f; --bad:#ff6b7a; --bad-soft:#3a1a20;
    --warn:#f2b84b; --warn-soft:#3a2d10; --code:#10161c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
header{display:flex;align-items:center;gap:14px;padding:14px 32px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.mark{width:36px;height:36px;border-radius:10px;display:block;box-shadow:0 4px 14px rgba(110,80,255,.35)}
.mark svg{width:100%;height:100%;display:block}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.15}.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.soc a{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:14px;font-weight:600;letter-spacing:0;text-decoration:none;line-height:1;transition:border-color .15s,transform .15s,color .15s}.soc a:hover,.soc a:focus-visible{color:var(--blue);border-color:var(--blue);transform:translateY(-1px)}.soc svg{width:22px;height:22px;flex:none}
.brand .name{background:linear-gradient(90deg,#1a8cff 0%,#7b5cff 55%,#ff5c9d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.btn{border:1px solid var(--line);background:var(--raised);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
main{max-width:1180px;margin:0 auto;padding:36px 32px 80px}

.hero h1{margin:0;font-size:34px;line-height:1.2;letter-spacing:-.02em;font-weight:700;max-width:26ch}
.hero p{margin:12px 0 0;color:var(--dim);font-size:18px;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:30px 0 8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--raised)}
.stat{padding:20px 24px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .v{font-size:46px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .l{margin-top:8px;font-weight:600;font-size:16px}
.stat .d{color:var(--dim);font-size:14px;margin-top:2px}
.stat.ok .v{color:var(--ok)}.stat.bad .v{color:var(--bad)}.stat.blue .v{color:var(--blue)}
.foot{color:var(--dim);font-size:14px;margin:10px 2px 34px}

h2{font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--raised)}
th{font-weight:600;font-size:14px;color:var(--dim);text-align:left;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface)}
tr.row[aria-expanded="true"] td{background:var(--surface)}
.fn{font:700 15px var(--mono);word-break:break-all}
.file{color:var(--dim);font-size:13px}
.out{font:13.5px/1.45 var(--mono);word-break:break-word;max-width:30ch}
.out.bad{color:var(--bad)}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.att{font-size:14px;color:var(--dim)}
.att b{color:var(--ink)}
tr.detail>td{padding:6px 24px 28px;background:var(--bg)}
tr.detail[hidden]{display:none}
.chev{display:inline-block;transition:transform .2s;color:var(--dim);margin-right:8px}
tr.row[aria-expanded="true"] .chev{transform:rotate(90deg)}

/* detail */
.attempt{padding:18px 0 14px;border-top:1px solid var(--line)}
.attempt:first-child{border-top:0}
.ahead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.ahead b{font-size:16px}
.ahead span{color:var(--dim);font-size:14px}
.rail{display:flex;align-items:flex-start;max-width:820px}
.station{display:flex;flex-direction:column;align-items:center;width:128px;flex:none;text-align:center}
.node{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--dim);transition:background .35s,border-color .35s,color .35s,transform .35s}
.station .nm{margin-top:8px;font-weight:600;font-size:14px}
.station .st{font-size:13px;color:var(--dim);min-height:40px}
.link{flex:1;height:2px;background:var(--line);margin-top:18px;position:relative;min-width:24px}
.link::after{content:"";position:absolute;left:0;top:0;height:100%;width:0;background:var(--ok);transition:width .55s ease}
.link.on::after{width:100%}
.station.ok .node{background:var(--ok);border-color:var(--ok);color:#fff}
.station.ok .st{color:var(--ok)}
.station.fail .node{background:var(--bad);border-color:var(--bad);color:#fff;transform:scale(1.12)}
.station.fail .st{color:var(--bad);font-weight:600}
.station.skipped .node,.station.off .node,.station.na .node{border-style:dashed;opacity:.55}
.station.end.ok .node{border-radius:11px}
.say{color:var(--dim);max-width:76ch;margin:6px 0 0;font-size:15px}
.say b{color:var(--ink)}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--raised);overflow:hidden}
.panel .cap{padding:8px 14px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);background:var(--surface)}
pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font:14px/1.55 var(--mono)}
.counter{margin-top:12px;max-width:820px;border-color:var(--bad);background:var(--bad-soft)}
.counter .cap{color:var(--bad);background:transparent;border-bottom:0;padding-bottom:0}
.counter pre{background:transparent}
.diff{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code);margin-top:14px}
.diff .cap{padding:8px 14px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);background:var(--surface)}
.ln{display:grid;grid-template-columns:44px 44px 1fr;font:14px/1.6 var(--mono)}
.ln span{padding:0 10px;white-space:pre-wrap;word-break:break-word}
.ln .g{color:var(--dim);text-align:right;user-select:none;opacity:.8}
.ln.a{background:var(--ok-soft)}.ln.a .t{color:var(--ok)}
.ln.r{background:var(--bad-soft)}.ln.r .t{color:var(--bad)}
.ln.h .t{color:var(--blue)}
.gone{visibility:hidden}
.stat2{color:var(--dim);font-size:14px;margin-top:10px}
@media(max-width:900px){
  main{padding:24px 16px 60px}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
  .hero h1{font-size:26px}.out{max-width:18ch}.station{width:84px}header{padding:12px 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.bar{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:14px 16px}
select,input[type=text]{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
select{max-width:340px}
input[type=text]{width:210px;font-family:var(--mono);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dim);margin-right:6px;vertical-align:baseline}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.hint{font-size:13px;color:var(--dim)}
.sp{flex:1}
.btn.go{padding:10px 26px;font-size:15px}
.btn.stop{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input.num{width:52px;text-align:center}
.dchip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;margin:2px 5px 2px 0;white-space:nowrap;line-height:1.5;border:0;font-family:inherit}
.dchip.ok{color:var(--ok);background:var(--ok-soft)}.dchip.warn{color:var(--warn);background:var(--warn-soft)}.dchip.bad{color:var(--bad);background:var(--bad-soft)}.dchip.nu{color:var(--dim);background:var(--surface)}
button.dchip{cursor:pointer}button.dchip:hover,button.dchip:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.hcmp{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.hcmp .hh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:13px;margin-bottom:6px}
.hcmp .hr{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:4px 10px;align-items:center;padding:6px 8px;margin:2px -8px;border-radius:10px;cursor:pointer}.hcmp .hr:hover,.hcmp .hr:focus-visible{background:var(--blue-soft);outline:0}
.hcmp .hn{font-size:12.5px;overflow-wrap:anywhere}.hcmp .hn small{display:block;color:var(--dim)}.hcmp .hb{display:grid;gap:3px}.hcmp .hb div{display:grid;grid-template-columns:1fr 48px;gap:6px;align-items:center;font-size:11.5px;color:var(--dim)}
.hcmp .hb .mtrack{height:8px}
#pop{position:fixed;z-index:2000;max-width:360px;min-width:250px;padding:12px 14px;border-radius:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.4);font-size:13px;pointer-events:none}
#pop b{display:block;font-size:13px}#pop .ps{color:var(--dim);font-size:12px;margin:2px 0 8px}
#pop .pr{display:grid;grid-template-columns:62px 1fr auto;gap:6px;align-items:center;padding:3px 0}#pop .pr.me{background:var(--blue-soft);border-radius:6px;padding:3px 4px}
#pop .pr small{color:var(--dim)}#pop .pf{color:var(--dim);font-size:12px;margin-top:8px}
.file.why{color:var(--red,#c0392b);white-space:normal;overflow-wrap:anywhere;max-width:190px}
/* toolbar: three groups, each with a caption; one control height */
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 28px;padding:16px 20px}
.bar .grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.bar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .cap{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);line-height:1}
.bar .brk{flex-basis:100%;height:0}
.bar .g-file{flex:1 1 260px}.bar .g-file select{width:100%;max-width:none}
.bar .g-model{flex:1 1 320px}
.bar .g-run{margin-left:auto}
.bar select,.bar input[type=text]{height:38px;box-sizing:border-box;padding:0 12px}
.bar .seg{height:38px;box-sizing:border-box;align-items:stretch}
.bar .seg button{display:flex;align-items:center;padding:0 16px}
.bar .seg.auto button{padding:0 14px;font-size:13px}
.bar .btn{height:38px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0 16px}
.bar .btn.go{padding:0 28px;font-size:15px}
.bar label.hint{display:inline-flex;align-items:center;gap:6px}
@media(max-width:640px){.bar .grp{flex:1 1 100%}.bar .g-run{margin-left:0}.bar .g-run .row{width:100%}.bar .g-run .btn.go{flex:1}.bar .seg{width:100%}.bar .seg button{flex:1;justify-content:center}}
/* Meta-style look: gradient buttons; Action = blue, Model = violet to pink, After a repair = teal */
.bar{align-items:stretch;gap:14px 16px;background:linear-gradient(180deg,var(--raised),var(--bg));border-color:rgba(10,124,255,.28);box-shadow:0 8px 30px rgba(10,60,160,.12)}
.bar .bpanel{padding:12px 14px 14px;border-radius:14px;border:1px solid var(--pc-line);background:var(--pc-bg)}
.bar .p-action{--pc-line:rgba(10,124,255,.38);--pc-bg:rgba(10,124,255,.09);--pc-cap:#3b8cff}
.bar .p-model{--pc-line:rgba(160,100,255,.42);--pc-bg:rgba(160,100,255,.10);--pc-cap:#a877ff}
.bar .p-auto{--pc-line:rgba(20,184,166,.38);--pc-bg:rgba(20,184,166,.08);--pc-cap:#14b8a6}
.bar .bpanel .cap{color:var(--pc-cap)}
.bar .g-file select{border-color:rgba(10,124,255,.35);background:var(--bg);font-weight:600}
.bar .g-model{flex:1 1 300px}
.bar .g-run{align-self:flex-end}
.bar .p-action .seg{border:0;background:rgba(10,124,255,.14);padding:3px;gap:2px}
.bar .p-action .seg button{border-radius:999px;height:32px;color:var(--ink);opacity:.8}
.bar .p-action .seg button::before{margin-right:7px;font-weight:700}
.bar #mode button[data-v="check"]::before{content:"\2713"}
.bar #mode button[data-v="repair"]::before{content:"\2726"}
.bar .p-action .seg button[aria-pressed="true"]{background:linear-gradient(135deg,#1a8cff,#0064e0);color:#fff;opacity:1;box-shadow:0 3px 10px rgba(0,100,224,.45)}
.bar #model{border:0;background:transparent;padding:0;gap:8px;overflow:visible;height:auto;flex-wrap:wrap}
.bar #model button{height:34px;border:1px solid rgba(160,100,255,.5);border-radius:999px;color:var(--ink);background:rgba(160,100,255,.08);padding:0 14px}
.bar #model button:hover{background:rgba(160,100,255,.18)}
.bar #model button[aria-pressed="true"]{border-color:transparent;color:#fff;background:linear-gradient(135deg,#6a5cff,#c04ad9 60%,#ff5c9d);box-shadow:0 3px 12px rgba(170,70,220,.45)}
.bar .p-model input[type=text],.bar .p-model input.num{border-color:rgba(160,100,255,.4)}
.bar .p-auto .seg{border:0;background:rgba(20,184,166,.12);padding:3px;gap:2px}
.bar .p-auto .seg button{border-radius:999px;height:32px;color:var(--ink);opacity:.8}
.bar .p-auto .seg button[aria-pressed="true"]{background:linear-gradient(135deg,#14b8a6,#0e9f8e);color:#fff;opacity:1;box-shadow:0 3px 10px rgba(14,159,142,.4)}
.bar .btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#1a8cff 0%,#0064e0 55%,#4a5cff 100%);box-shadow:0 6px 18px rgba(0,100,224,.4);transition:filter .15s,transform .15s}
.bar .btn.primary:hover:not([disabled]){filter:brightness(1.1);transform:translateY(-1px)}
.bar .btn.stop{border:0;color:#fff;background:linear-gradient(135deg,#ff6b6b,#e0334c);box-shadow:0 6px 18px rgba(224,51,76,.35)}
.bar .btn.go{min-width:128px}
@media(max-width:640px){.bar .bpanel{flex:1 1 100%}}
/* layout: file picker on its own row; below it Action, Model, After a repair and Run fill the row */
.bar .brk{display:none}
.bar .g-file{flex:1 1 100%;order:1}
.bar .p-action{order:2;flex:0 0 auto}
.bar .g-model{order:3;flex:1 1 280px}

/* larger controls */
.bar{gap:16px 18px;padding:18px 22px}
.bar .cap{font-size:12px}
.bar select,.bar input[type=text]{height:46px;font-size:16px;padding:0 14px}
.bar .seg{height:46px}
.bar .seg button{font-size:16px;padding:0 22px}
.bar .p-action .seg button,.bar .p-auto .seg button{height:40px}
.bar .p-auto .seg button{font-size:15px;padding:0 18px}
.bar #model button{height:40px;font-size:15px;padding:0 18px}

/* larger brand */
.brand{gap:18px;font-size:44px;letter-spacing:-.03em}
.mark{width:76px;height:76px;border-radius:20px;box-shadow:0 6px 20px rgba(110,80,255,.4)}
header{padding-top:16px;padding-bottom:16px}
@media(max-width:640px){.brand{font-size:30px;gap:12px}.mark{width:52px;height:52px;border-radius:14px}}
/* model row: one full-width panel, chips on one line, address and status on the same line */
.bar .g-model{order:2;flex:1 1 100%}
.bar .p-action{order:3}.bar .p-auto{order:4}.bar .g-run{order:5}
.bar .g-model .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.bar #model{flex:0 1 auto;flex-wrap:nowrap;gap:8px}

.bar #endpoint[hidden] ~ #attwrap{margin-left:auto}
@media(max-width:900px){.bar #model{flex-wrap:wrap}.bar #endpoint{margin-left:0;width:100%}}
.bar .btn.resume{border:1px solid rgba(20,184,166,.6);color:#14b8a6;background:rgba(20,184,166,.10);font-weight:700}
.bar .btn.resume:hover{background:rgba(20,184,166,.20)}
[hidden]{display:none!important}
#theme{font-size:18px;padding:4px 12px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0 10px}
.tile{border:1px solid var(--line);border-radius:14px;background:var(--raised);padding:14px 18px}
.tile .v{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .l{margin-top:6px;font-size:14px;color:var(--dim);font-weight:600}
.tile.bad .v{color:var(--bad)}.tile.ok .v{color:var(--ok)}.tile.blue .v{color:var(--blue)}
.meter{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface);margin:0 0 22px;border:1px solid var(--line)}
.meter i{display:block;height:100%;transition:width .4s}
.m-ok{background:var(--ok)}.m-bad{background:var(--bad)}.m-warn{background:var(--warn)}.m-blue{background:var(--blue)}

<script>
"use strict";
const TOKEN = (document.querySelector('meta[name="pp-token"]') || {}).content || "";
const $ = (id) => document.getElementById(id);
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, cls, text){const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined && text !== null) e.textContent = text; return e;}
function short(x, n){const s = typeof x === "string" ? x : JSON.stringify(x); return s.length <= n ? s : s.slice(0, n - 1) + "…";}
function fmt(x){if(typeof x === "string") return x; const c = JSON.stringify(x); return c.length <= 110 ? c : JSON.stringify(x, null, 1);}
async function api(path, body){
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST", headers: {"X-PatchPilot-Token": TOKEN, "Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  let j = null; try{j = await r.json();}catch(e){}
  if(!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
  if(j === null) throw new Error("unreadable answer from the server");
  return j;
}

/* ---------- reasons, local model guard, report, compare ---------- */
let localOk = null, localWhy = "";
const sh = (x, n) => short(x === undefined ? "" : x, n);
function localDown(){return pick.mode === "repair" && pick.model === "local" && localOk === false;}
function localMsg(){return "The local model is not running (" + (localWhy || "no answer") + "). Start llama-server, or pick a hosted model.";}
function runState(){const b = $("run"); b.disabled = running || racing || !(S && S.manifests.length) || localDown(); b.title = localDown() ? localMsg() : "Check the file, then let the selected model fix every function that differs";}
function whyRejected(r){
  const a = att(r).filter((x) => x.gates && x.gates.outcome !== "accepted"); if(!a.length) return "";
  const x = a[a.length - 1], ce = x.counterexample;
  let t = (r.status === "repaired" ? "earlier " : "last ") + "try " + (x.attempt || att(r).indexOf(x) + 1) + " " + x.gates.outcome;
  if(ce) t += " · input " + sh(ce.input, 36) + " · expected " + sh(ce.expected, 28) + " · got " + sh(ce.got, 28);
  else if(x.diagnosis) t += " · " + sh(x.diagnosis, 80);
  return t;
}
function reportData(){
  const c = counts(), ms = modelStats();
  const rs = rows.filter((r) => r.status).map((r) => ({fn: r.function || "", file: r.file || "", status: (STATUS[r.status] || [r.status])[0], fixed: r.status === "repaired", model: r.ran_by ? mname(r.ran_by) : "", tries: att(r).length, applied: !!r.applied, why: whyRejected(r), diff: r.diff || "",
    blocked: att(r).filter((x) => x.gates && x.gates.outcome !== "accepted").map((x) => "try " + (x.attempt || "?") + " " + x.gates.outcome + (x.counterexample ? " · input " + sh(x.counterexample.input, 60) + " · expected " + sh(x.counterexample.expected, 40) + " · got " + sh(x.counterexample.got, 40) : ""))}));
  return {when: new Date().toISOString().slice(0, 16).replace("T", " "), root: S ? S.root : "", c, rows: rs, models: Object.keys(ms).map((k) => Object.assign({name: mname(k), id: k}, ms[k]))};
}
const mdc = (x) => String(x == null ? "" : x).replace(/\|/g, "\\|").replace(/\n/g, " ");
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, (ch) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch]));
function reportMd(d){
  const L = ["# PatchPilot report", "", "Project `" + d.root + "` · " + d.when + " UTC · " + d.c.n + " functions, " + d.c.differs + " differ, " + d.c.fixed + " fixed, " + d.c.blocked + " bad patches blocked", ""];
  if(d.models.length){
    L.push("## Models", "", "| model | fixed / tried | patch tries | bad patches blocked | tokens | time | functions it fixed |", "|---|---|---|---|---|---|---|");
    d.models.forEach((m) => L.push("| " + [m.id, m.fixed + " / " + m.n, m.tries, m.blocked, m.tok ? m.tok.toLocaleString("en-US") : "", m.sec ? Math.round(m.sec) + " s" : "", m.names.join(", ")].map(mdc).join(" | ") + " |"));
    L.push("", "Each function is counted under the model that worked on it last. One run on this set, not a success rate.", "");
  }

    $("endpoint").value = S.endpoint;
  }
  const h = $("history"), cur = h.value; h.textContent = ""; h.appendChild(new Option("Past runs", "")); S.previous.forEach((p) => h.appendChild(new Option(p.id, p.id))); h.value = cur;
  sync(); render();
}
$("endpoint").oninput = () => {clearTimeout(hTimer); hTimer = setTimeout(checkHealth, 400);};
let theme = "auto";
$("theme").onclick = () => {theme = theme === "auto" ? "dark" : theme === "dark" ? "light" : "auto"; if(theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);};
loadState(false).then(async () => {const j = await api("/api/job?since=0"); if(j.status){curJob = j.id; jobRepair = !!(j.params && j.params.mode === "repair"); lastModel = (j.params && j.params.model) || null; if(jobRepair){pick.mode = "repair"; if(lastModel) pick.model = lastModel; sync();} if(j.status === "running" || j.status === "stopping"){running = true; follow();} else {(j.events || []).forEach(onEvent); since = j.n; rows.forEach((r) => r.working = false); render();}}raceRestore();}).catch((e) => showErr(e.message));
